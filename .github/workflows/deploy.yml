# Собирает Docker-образ, публикует его в GitHub Container Registry
# и разворачивает на удалённом сервере по SSH.
#
# Нужные секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_HOST          — IP или домен сервера
#   SSH_USER          — пользователь SSH
#   SSH_PRIVATE_KEY   — приватный ключ для входа на сервер
#   SSH_PORT          — порт SSH (обычно 22)
#   GHCR_TOKEN        — PAT с правом read:packages (для docker pull на сервере)
#
# На сервере должны быть установлены Docker и docker login в ghcr.io.

name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: server-time-api
  APP_PORT: 8000

jobs:
  build-and-push:
    name: Сборка и публикация образа
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Имя образа в нижнем регистре
        id: meta
        run: |
          image="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Вход в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сборка и публикация образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Деплой на сервер
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Подключение по SSH, pull образа и запуск
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USERNAME,IMAGE,TAG,CONTAINER_NAME,APP_PORT
          script_stop: true
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE:$TAG"
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$APP_PORT:8000" \
              "$IMAGE:$TAG"
            docker image prune -f
            docker logout ghcr.io
